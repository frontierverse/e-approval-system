name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit, build, database, and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/e_approval_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/e_approval_test
      AUTH_SECRET: ci-only-session-secret-not-used-outside-github-actions
      ATTACHMENT_STORAGE_DRIVER: local
      E2E_USER_NAME: 김민준
      E2E_USER_PASSWORD: password123
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e_approval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d e_approval_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply PostgreSQL migrations
        run: npm run db:deploy

      - name: Seed test database
        run: npm run db:seed

      - name: Run unit tests
        run: npm run test

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type checks
        run: npm run typecheck

      - name: Build production application
        run: npm run build

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
